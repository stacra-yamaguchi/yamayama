<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Hunter Field action illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091225"/>
      <stop offset="0.55" stop-color="#16233a"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.74" cy="0.34" r="0.34">
      <stop offset="0" stop-color="#ffcb73" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#ff7f4e" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ff7f4e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.2" cy="0.2" r="0.35">
      <stop offset="0" stop-color="#9cecff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9cecff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df6ff"/>
      <stop offset="1" stop-color="#2ecbff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#moon)"/>
  <rect width="960" height="540" fill="url(#fire)"/>

